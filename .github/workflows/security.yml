# TEND security verification. Runs on every pull request and every push. One required check: "security-gate", which passes only if every job
# below passed. Make it required in Settings → Branches → branch protection (or a ruleset) for main; without that, a red run does not block a merge.
#
# Nothing here uses repository secrets, deploys, or talks to a hosted TEND, Vercel or Neon: every server and database is started inside the job
# and thrown away with it. Third-party actions are pinned to full commit SHAs; the gitleaks binary is checked against its published SHA-256.
name: security

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  NEXT_TELEMETRY_DISABLED: "1"
  CI: "true"

jobs:
  static:
    name: typecheck and lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm }
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint

  dependencies:
    name: dependency vulnerabilities
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: "${{ env.NODE_VERSION }}" }
      # Every advisory, any severity, fails unless allow-listed with a reason and an expiry (ci/audit-allowlist.json). The lockfile is audited as
      # committed; nothing is installed.
      - run: node scripts/ci/audit-gate.mjs
      - name: lockfile integrity (one registry, every package hashed)
        run: |
          node -e '
            const p = require("./package-lock.json").packages; let bad = [];
            for (const [k, v] of Object.entries(p)) { if (!k || v.link) continue;
              if (!v.integrity) bad.push(k + ": no integrity hash");
              if (v.resolved && !v.resolved.startsWith("https://registry.npmjs.org/")) bad.push(k + ": resolved from " + v.resolved); }
            if (bad.length) { console.error(bad.join("\n")); process.exit(1); } console.log("lockfile ok:", Object.keys(p).length - 1, "packages");'

  secrets:
    name: secret scanning
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false, fetch-depth: 0 } # full history: a secret removed in a later commit is still leaked
      - name: install gitleaks 8.30.1 (checksum verified)
        run: |
          curl -sSfL -o gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tgz" | sha256sum --check --strict
          tar -xzf gitleaks.tgz gitleaks && rm gitleaks.tgz
      - name: scan the whole git history
        run: ./gitleaks git --config .gitleaks.toml --redact --no-banner --exit-code 1 --report-format json --report-path gitleaks-report.json .
      - name: keep the (redacted) report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: gitleaks-report, path: gitleaks-report.json, retention-days: 7 }

  tests:
    name: unit and PostgreSQL tests, backup drill
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tend_test
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust # a throwaway database inside this job, reachable only from it
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tend_test" --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      TEND_TEST_DATABASE_URL: postgres://tend_test@127.0.0.1:5432/postgres
      TEND_DRILL_DATABASE_URL: postgres://tend_test@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm }
      - run: npm ci --no-audit --no-fund
      # The isolated-server tests need a production build; without one they would skip, and the gate below fails on a skip.
      - run: npm run build
      # Fails on any failure, cancellation or todo, on a skip whose reason is not allow-listed (ci/test-policy.json), on fewer tests than the floor,
      # and if TEND_TEST_DATABASE_URL is missing. So the PostgreSQL and two-tenant tests cannot be skipped silently here.
      - run: npm run test:gate
      - name: PostgreSQL client tools for the drill (same major version as the server)
        run: sudo apt-get install -y --no-install-recommends postgresql-client-16 && echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH"
      - run: npm run drill:backup

  e2e:
    name: authentication, tenant isolation and enforcement end to end
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tend_test
          POSTGRES_DB: tend_e2e
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tend_test" --health-interval 2s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm }
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      # Each script starts its own isolated production server with a throwaway database and token, and exits non-zero on any failed check.
      - name: authorization (approvals, single use, replay, expiry, revocation, CSRF, rate limits)
        run: npm run e2e:authz
      - name: accounts and two-tenant isolation over HTTP
        run: npm run e2e:accounts
      - name: gateway (TEND holds the credential)
        run: npm run e2e:gateway
      - name: enforcement with a side-effect ledger, two tenants (embedded database)
        run: npm run e2e:enforcement
      # Same demonstration on real PostgreSQL concurrency. Accounts need a mail service on a database server, so the three cross-tenant checks
      # cannot run here and are explicitly allowed to skip (they ran in the step above and in the PostgreSQL two-tenant unit tests). Any other
      # skip still fails.
      - name: enforcement on PostgreSQL (real concurrent connections)
        run: npm run e2e:enforcement
        env:
          TEND_E2E_DATABASE_URL: postgres://tend_test@127.0.0.1:5432/tend_e2e
          TEND_E2E_ALLOW_SKIPS: cross-tenant

  security-gate:
    name: security-gate
    if: always()
    needs: [static, dependencies, secrets, tests, e2e]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: every security job passed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node -e '
            const r = JSON.parse(process.env.RESULTS);
            const bad = Object.entries(r).filter(([, v]) => v.result !== "success");
            for (const [k, v] of Object.entries(r)) console.log(`${v.result === "success" ? "ok  " : "FAIL"} ${k}: ${v.result}`);
            if (bad.length) process.exit(1);'
