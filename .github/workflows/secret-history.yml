name: secret-history

# Secrets anywhere in the git history (the security workflow's secretlint only sees the working tree). gitleaks as its release binary, checked
# against the release's published SHA-256; no token is passed to it.
on:
  workflow_dispatch: # run by hand from the Actions tab, on any branch
  pull_request:
  push:
    branches: [main, "security/**"] # security branches run the full suite before any pull request

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks 8.18.4 (checksum verified)
        run: |
          curl -sSfL -o gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz
          echo "ba6dbb656933921c775ee5a2d1c13a91046e7952e9d919f9bac4cec61d628e7d  gitleaks.tgz" | sha256sum --check --strict
          tar -xzf gitleaks.tgz -C "$RUNNER_TEMP" gitleaks && rm gitleaks.tgz
      - name: gitleaks (this branch's full history)
        # Fails on any finding. The log lists each finding's rule, file, line and commit (never the value, never author e-mails) so it can be
        # triaged; a finding that is verified to be a test fixture goes into .gitleaksignore by its fingerprint, one reviewed entry at a time.
        # --log-opts=HEAD: the history of the commit being checked. The full checkout also fetches every other branch; each is checked by its own run.
        run: |
          mkdir -p "$RUNNER_TEMP/gl"
          "$RUNNER_TEMP/gitleaks" detect --source . --log-opts=HEAD --redact \
            --exit-code 0 --no-banner --report-format json --report-path "$RUNNER_TEMP/gl/report.json"
          n=$(jq length "$RUNNER_TEMP/gl/report.json")
          jq -r '.[] | "\(.RuleID)\t\(.File):\(.StartLine)\tcommit \(.Commit[0:12])\tfingerprint \(.Fingerprint)"' "$RUNNER_TEMP/gl/report.json"
          echo "$n finding(s)"
          test "$n" -eq 0
