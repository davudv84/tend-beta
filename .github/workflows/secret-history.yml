name: secret-history

# Secrets anywhere in the git history (the security workflow's secretlint only sees the working tree). gitleaks in its official container,
# pinned to a release; no token is passed to it.
on:
  pull_request:
  push:
    branches: [main, "security/**"] # security branches run the full suite before any pull request

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks (full history)
        run: docker run --rm -v "$PWD:/repo:ro" ghcr.io/gitleaks/gitleaks:v8.18.4 detect --source /repo --redact --exit-code 1 --no-banner
