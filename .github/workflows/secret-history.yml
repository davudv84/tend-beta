name: secret-history

# Secrets anywhere in the git history (the security workflow's secretlint only sees the working tree). gitleaks in its official container,
# pinned to a release; no token is passed to it.
on:
  workflow_dispatch: # run by hand from the Actions tab, on any branch
  pull_request:
  push:
    branches: [main, "security/**"] # security branches run the full suite before any pull request

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks (full history)
        # Fails on any finding. The log lists each finding's rule, file, line and commit (never the value, never author e-mails) so it can be
        # triaged; a finding that is verified to be a test fixture goes into .gitleaksignore by its fingerprint, one reviewed entry at a time.
        run: |
          mkdir -p "$RUNNER_TEMP/gl"
          docker run --rm -v "$PWD:/repo:ro" -v "$RUNNER_TEMP/gl:/out" ghcr.io/gitleaks/gitleaks:v8.18.4 detect --source /repo --redact \
            --exit-code 0 --no-banner --report-format json --report-path /out/report.json
          n=$(jq length "$RUNNER_TEMP/gl/report.json")
          jq -r '.[] | "\(.RuleID)\t\(.File):\(.StartLine)\tcommit \(.Commit[0:12])\tfingerprint \(.Fingerprint)"' "$RUNNER_TEMP/gl/report.json"
          echo "$n finding(s)"
          test "$n" -eq 0
