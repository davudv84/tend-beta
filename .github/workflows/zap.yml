name: zap-baseline

# OWASP ZAP baseline (passive) scan against a TEND production build started inside this job on localhost: never against a deployed
# instance. Runs on pushes to security/** branches, and by hand once it is on main (Actions → zap-baseline → Run workflow). Fails on any WARN-level finding not listed in .zap/rules.tsv (the listed ones are reviewed and still printed, as INFO).
# The image is pinned to the digest of the reviewed run of 2026-11-21 (zaproxy:stable at that time); update it deliberately, then re-review.
on:
  workflow_dispatch:
  push:
    branches: ["security/**"] # manual runs need the workflow on main; security branches run it on push

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Start an isolated TEND (embedded database, throwaway admin token)
        run: |
          export TEND_ADMIN_TOKEN="$(openssl rand -hex 32)" TEND_DATA_DIR="$RUNNER_TEMP/tend-data" PORT=3210
          nohup npx next start -p 3210 > "$RUNNER_TEMP/tend.log" 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:3210/api/health && break; sleep 1; done
      - name: ZAP baseline
        run: |
          mkdir -p "$RUNNER_TEMP/zap" && cp .zap/rules.tsv "$RUNNER_TEMP/zap/" && chmod -R 777 "$RUNNER_TEMP/zap"
          docker run --rm --network host -v "$RUNNER_TEMP/zap:/zap/wrk:rw" ghcr.io/zaproxy/zaproxy@sha256:9624669db72f54d86c4b46a7064518bd9bf79d8c61a4c31befa9923489f328af \
            zap-baseline.py -t http://127.0.0.1:3210 -c rules.tsv -r report.html
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: zap-report
          path: ${{ runner.temp }}/zap/report.html
