version: 2
updates:
  # Keeps GitHub Actions current; review each bump (and pin to commit SHAs once the repository adopts that, docs/ci.md).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
