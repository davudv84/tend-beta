<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Canvas office</title>
<style>
  :root { --floor: #1b1e24; --tile: #22262e; --desk: #6b5236; --top: #8a6a45; --wall: #2b303a; --ink: #e8eaef; --dim: #9aa1ad; }
  :root[data-scheme="light"] { --floor: #efe9df; --tile: #e6dfd2; --desk: #a07850; --top: #c19a6b; --wall: #d6cfc2; --ink: #1d2027; --dim: #5d6470; }
  html, body { margin: 0; height: 100%; background: var(--floor); color: var(--ink); font: 13px/1.3 system-ui, sans-serif; }
  canvas { display: block; width: 100%; height: 100%; }
  #wait { position: absolute; inset: 0; display: grid; place-items: center; color: var(--dim); }
  #wait[hidden] { display: none; }
</style>
</head>
<body>
<canvas id="floor"></canvas>
<div id="wait">Waiting for the office…</div>
<script>
// TEMPLATE: a flat 2D office on one canvas. A wall with the board of cards, desks in rows, the lead's desk first,
// each agent a figure at a desk, coloured by its status, with its name and what it is doing. Click a figure to
// open that agent. Everything shown comes from window.md.onData; the only thing it does is window.md.ask.
// Make it the office the person asked for: change the room, the desks, the figures, the colours. See GUIDE.md.
const canvas = document.getElementById('floor');
const ctx = canvas.getContext('2d');
let state = null;
let spots = [];            // where each agent was drawn, for clicks: { token, x, y, r }
let frame = 0, last = 0, running = false;

const STATUS_COLOUR = {
  working: '#4cc38a', typing: '#4cc38a', thinking: '#7aa7ff', compacting: '#7aa7ff',
  waiting: '#f2b84b', blocked: '#ef7d6b', looping: '#ef7d6b',
  idle: '#8b93a1', success: '#4cc38a', ghost: '#5b6270',
};
const BUSY = new Set(['working', 'typing', 'thinking', 'compacting']);

window.md.onData((s) => {
  if (!s || s.v !== 1) return;   // a line version this theme does not know: draw nothing rather than guess
  state = s;
  document.documentElement.dataset.scheme = s.look.scheme;
  document.documentElement.dir = s.look.dir;
  document.getElementById('wait').hidden = true;
  draw();
  play();
});

function size() {
  const r = window.devicePixelRatio || 1;
  canvas.width = Math.round(canvas.clientWidth * r);
  canvas.height = Math.round(canvas.clientHeight * r);
  ctx.setTransform(r, 0, 0, r, 0, 0);
}
window.addEventListener('resize', () => { size(); draw(); });
size();

function css(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }

// Motion: a small bob for busy agents, at 15 frames a second, never when the person asked for less motion or Home is hidden.
function play() {
  if (running || !state || state.look.reducedMotion || document.hidden) return;
  running = true;
  requestAnimationFrame(tick);
}
function tick(t) {
  if (!state || state.look.reducedMotion || document.hidden) { running = false; return; }
  if (t - last >= 66) { last = t; frame++; draw(); }
  requestAnimationFrame(tick);
}
document.addEventListener('visibilitychange', play);

function draw() {
  if (!state) return;
  const W = canvas.clientWidth, H = canvas.clientHeight, rtl = state.look.dir === 'rtl';
  // The floor, in tiles.
  ctx.fillStyle = css('--floor');
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = css('--tile');
  for (let y = 0; y < H; y += 32) for (let x = (y / 32) % 2 ? 32 : 0; x < W; x += 64) ctx.fillRect(x, y, 32, 32);
  // The wall, with the board: how many cards are in progress and blocked.
  ctx.fillStyle = css('--wall');
  ctx.fillRect(0, 0, W, 56);
  const doing = state.tasks.filter((t) => t.status === 'doing').length;
  const blocked = state.tasks.filter((t) => t.status === 'blocked').length;
  ctx.fillStyle = css('--ink');
  ctx.font = '600 13px system-ui, sans-serif';
  ctx.textAlign = rtl ? 'right' : 'left';
  ctx.fillText(doing + ' in progress · ' + blocked + ' blocked · ' + state.asks.length + ' waiting for you', rtl ? W - 16 : 16, 34);
  // The desks: the lead first, then everyone else, in rows.
  const agents = [...state.agents].sort((a, b) => (a.role === 'lead' ? -1 : b.role === 'lead' ? 1 : 0));
  const cellW = 150, cellH = 120, top = 84;
  const cols = Math.max(1, Math.floor((W - 32) / cellW));
  spots = [];
  agents.forEach((a, i) => {
    const col = i % cols, row = Math.floor(i / cols);
    const cx = rtl ? W - 16 - cellW * col - cellW / 2 : 16 + cellW * col + cellW / 2;
    const cy = top + cellH * row + 40;
    // The desk.
    ctx.fillStyle = css('--desk');
    ctx.fillRect(cx - 44, cy + 14, 88, 26);
    ctx.fillStyle = css('--top');
    ctx.fillRect(cx - 44, cy + 14, 88, 6);
    // The figure: a body and a head, bobbing while busy.
    const bob = BUSY.has(a.status) && !state.look.reducedMotion ? Math.round(Math.sin((frame + i * 3) / 2) * 2) : 0;
    const colour = STATUS_COLOUR[a.status] || css('--dim');
    ctx.globalAlpha = a.status === 'ghost' ? 0.45 : 1;
    ctx.fillStyle = colour;
    ctx.fillRect(cx - 12, cy - 6 + bob, 24, 22);
    ctx.beginPath(); ctx.arc(cx, cy - 16 + bob, 10, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
    if (a.role === 'lead') { ctx.fillStyle = css('--ink'); ctx.fillRect(cx - 8, cy - 30 + bob, 16, 4); }
    // An open question or held mail: a badge over the head.
    const asks = state.asks.filter((q) => q.agent === a.token).length + (a.unread > 0 ? 1 : 0);
    if (asks) {
      ctx.fillStyle = '#ef7d6b';
      ctx.beginPath(); ctx.arc(cx + 14, cy - 28 + bob, 7, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#ffffff'; ctx.font = '700 10px system-ui, sans-serif'; ctx.textAlign = 'center';
      ctx.fillText('!', cx + 14, cy - 24 + bob);
    }
    // The name and what it is doing.
    ctx.textAlign = 'center';
    ctx.fillStyle = css('--ink');
    ctx.font = '600 12px system-ui, sans-serif';
    ctx.fillText(a.name, cx, cy + 56, cellW - 12);
    ctx.fillStyle = css('--dim');
    ctx.font = '11px system-ui, sans-serif';
    ctx.fillText(a.status + (a.tool ? ' · ' + a.tool : ''), cx, cy + 70, cellW - 12);
    spots.push({ token: a.token, x: cx, y: cy, r: 40 });
  });
}

canvas.addEventListener('click', (e) => {
  const r = canvas.getBoundingClientRect();
  const px = e.clientX - r.left, py = e.clientY - r.top;
  const hit = spots.find((s) => Math.abs(px - s.x) <= s.r && Math.abs(py - s.y) <= s.r);
  if (hit) window.md.ask({ kind: 'openAgent', agent: hit.token });
});
</script>
</body>
</html>
