<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Three.js office</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #14161b; font: 13px/1.3 system-ui, sans-serif; }
  :root[data-scheme="light"] body { background: #f4f2ee; }
  canvas { display: block; width: 100%; height: 100%; }
  #wait { position: absolute; inset: 0; display: grid; place-items: center; color: #9aa1ad; }
  #wait[hidden] { display: none; }
</style>
</head>
<body>
<div id="wait">Waiting for the office…</div>
<script type="module">
// TEMPLATE: a 3D office with three.js, served by the app at mdtheme://lib/three.module.js (nothing loads from the
// internet). A floor, a desk per agent in rows, each agent a figure coloured by its status with its name above it,
// and a camera that turns slowly round the room. Click a figure to open that agent. See GUIDE.md.
import * as THREE from 'mdtheme://lib/three.module.js';

const STATUS_COLOUR = {
  working: 0x4cc38a, typing: 0x4cc38a, thinking: 0x7aa7ff, compacting: 0x7aa7ff,
  waiting: 0xf2b84b, blocked: 0xef7d6b, looping: 0xef7d6b,
  idle: 0x8b93a1, success: 0x4cc38a, ghost: 0x5b6270,
};
const BUSY = new Set(['working', 'typing', 'thinking', 'compacting']);
const SPACING = 3;

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 200);
scene.add(new THREE.HemisphereLight(0xffffff, 0x445566, 1.2));
const sun = new THREE.DirectionalLight(0xffffff, 1.4);
sun.position.set(6, 12, 8);
scene.add(sun);
const floor = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), new THREE.MeshStandardMaterial({ color: 0x2a2f38 }));
floor.rotation.x = -Math.PI / 2;
scene.add(floor);

const deskGeo = new THREE.BoxGeometry(1.8, 0.75, 0.9);
const deskMat = new THREE.MeshStandardMaterial({ color: 0x8a6a45 });
const bodyGeo = new THREE.CylinderGeometry(0.28, 0.32, 0.8, 16);
const headGeo = new THREE.SphereGeometry(0.24, 16, 12);

let state = null;
let people = new Map();   // agent token -> { group, body, label, name, status }
let radius = 8, angle = 0.7, last = 0, running = false;

/** A name tag drawn on a small canvas, so text needs no font file. */
function label(text) {
  const c = document.createElement('canvas');
  c.width = 256; c.height = 64;
  const g = c.getContext('2d');
  g.fillStyle = 'rgba(20,22,27,0.8)';
  g.fillRect(0, 8, 256, 48);
  g.fillStyle = '#ffffff';
  g.font = '600 26px system-ui, sans-serif';
  g.textAlign = 'center';
  g.fillText(text.slice(0, 18), 128, 42);
  const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(c), depthTest: false }));
  sprite.scale.set(2, 0.5, 1);
  return sprite;
}

function person(a) {
  const group = new THREE.Group();
  const desk = new THREE.Mesh(deskGeo, deskMat);
  desk.position.set(0, 0.375, 0.7);
  const body = new THREE.Mesh(bodyGeo, new THREE.MeshStandardMaterial({ color: STATUS_COLOUR[a.status] ?? 0x8b93a1, transparent: true }));
  body.position.y = 0.4;
  const head = new THREE.Mesh(headGeo, body.material);
  head.position.y = 1.05;
  body.add(head);
  const tag = label(a.name);
  tag.position.y = 2.1;
  group.add(desk, body, tag);
  group.userData.token = a.token;
  scene.add(group);
  return { group, body, label: tag, name: a.name, status: a.status };
}

window.md.onData((s) => {
  if (!s || s.v !== 1) return;   // a line version this theme does not know: draw nothing rather than guess
  state = s;
  document.documentElement.dataset.scheme = s.look.scheme;
  document.getElementById('wait').hidden = true;
  scene.background = new THREE.Color(s.look.scheme === 'light' ? 0xf4f2ee : 0x14161b);
  floor.material.color.set(s.look.scheme === 'light' ? 0xd9d2c5 : 0x2a2f38);
  // Each agent keeps its figure from one state to the next; one that left is taken away.
  const seen = new Set();
  const cols = Math.max(1, Math.ceil(Math.sqrt(s.agents.length)));
  s.agents.forEach((a, i) => {
    seen.add(a.token);
    let p = people.get(a.token);
    if (p && p.name !== a.name) { scene.remove(p.group); p = undefined; }
    if (!p) { p = person(a); people.set(a.token, p); }
    p.status = a.status;
    p.body.material.color.setHex(STATUS_COLOUR[a.status] ?? 0x8b93a1);
    p.body.material.opacity = a.status === 'ghost' ? 0.4 : 1;
    p.group.position.set((i % cols - (cols - 1) / 2) * SPACING, 0, (Math.floor(i / cols) - (Math.ceil(s.agents.length / cols) - 1) / 2) * SPACING);
  });
  for (const [token, p] of people) if (!seen.has(token)) { scene.remove(p.group); people.delete(token); }
  radius = Math.max(8, cols * SPACING * 1.4);
  floor.scale.set(cols * SPACING + 6, cols * SPACING + 6, 1);
  render(performance.now());
  play();
});

function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / Math.max(1, h);
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', () => { resize(); render(performance.now()); });
resize();

function render(t) {
  camera.position.set(Math.cos(angle) * radius, radius * 0.75, Math.sin(angle) * radius);
  camera.lookAt(0, 0.5, 0);
  if (state && !state.look.reducedMotion) {
    for (const p of people.values()) p.body.position.y = 0.4 + (BUSY.has(p.status) ? Math.abs(Math.sin(t / 250 + p.group.position.x)) * 0.12 : 0);
  }
  renderer.render(scene, camera);
}

// 30 frames a second at most; still when the person asked for less motion; nothing while Home is hidden.
function play() {
  if (running || !state || state.look.reducedMotion || document.hidden) return;
  running = true;
  requestAnimationFrame(tick);
}
function tick(t) {
  if (!state || state.look.reducedMotion || document.hidden) { running = false; return; }
  if (t - last >= 33) { angle += (t - last) / 20000; last = t; render(t); }
  requestAnimationFrame(tick);
}
document.addEventListener('visibilitychange', play);

const ray = new THREE.Raycaster();
renderer.domElement.addEventListener('click', (e) => {
  const r = renderer.domElement.getBoundingClientRect();
  ray.setFromCamera(new THREE.Vector2(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1), camera);
  for (const hit of ray.intersectObjects(scene.children, true)) {
    let o = hit.object;
    while (o && !o.userData.token) o = o.parent;
    if (o) { window.md.ask({ kind: 'openAgent', agent: o.userData.token }); return; }
  }
});
</script>
</body>
</html>
